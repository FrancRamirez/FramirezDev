<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión | Francisco Ramirez</title>
  <!-- Favicon -->
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/icons/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/icons/apple-touch-icon.png">
  <meta name="theme-color" content="#384cc1">
  <meta name="robots" content="noindex">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>
  <canvas id="starsCanvas"></canvas>

  <header class="navbar" id="navbar">
    <div class="navbar__inner">
      <a href="index.html#inicio" class="navbar__logo">Framirez<span class="dot">.</span>dev</a>
    </div>
  </header>

  <main class="auth-main">
    <div class="auth-card">
      <h1 class="auth-card__title">Iniciar sesión</h1>
      <p class="auth-card__subtitle">Ingresá con tu nombre de usuario y contraseña</p>

      <form id="loginForm" class="auth-form" novalidate>
        <div>
          <label for="username">Nombre de usuario</label>
          <input type="text" id="username" name="username" autocomplete="username" required>
        </div>
        <div>
          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" autocomplete="current-password" required>
        </div>

        <button type="submit" class="btn btn--primary">Ingresar</button>
        <p class="auth-card__status" id="authStatus" role="status" aria-live="polite"></p>
      </form>

      <p class="auth-card__footer">¿No tenés cuenta? <a href="registro.html" id="registroLink">Registrate</a></p>
    </div>
  </main>

  <footer class="footer">
    <p>&copy; <span id="year"></span> Framirez.dev - Todos los derechos reservados</p>
  </footer>

  <script src="js/script.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
